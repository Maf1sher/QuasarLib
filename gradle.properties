# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft and NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.264,)
loader_version_range=[1,)

# Parchment mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Required client dependency (0.6.13 and 0.8.13 both ship for 1.21.1)
sodium_version_range=[0.6.0,)

# Mod properties
mod_id=quasar_lib
mod_name=QuasarLib
mod_license=MIT
mod_version=0.1.0
mod_group_id=mafisher.quasar
mod_authors=Maf1sher
mod_url=https://github.com/Maf1sher/QuasarLib
mod_issue_tracker_url=https://github.com/Maf1sher/QuasarLib/issues

# Content is a sibling mod entry point so demos stay extractable. It ships in
# the same jar for now; extraction moves the package, assets, and this metadata.
content_mod_id=quasar_content
content_mod_name=QuasarLib Content
content_mod_description=Acceptance demos and content-owned effects for QuasarLib.
