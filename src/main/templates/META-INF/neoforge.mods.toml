modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
modUrl="${mod_url}"
description='''
QuasarLib provides reusable visual effects, segmented world effects, cinematic sequencing, effect entities, and server-side effect hitboxes.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sodium"
type="required"
versionRange="${sodium_version_range}"
ordering="NONE"
side="CLIENT"

[[mods]]
modId="${content_mod_id}"
version="${mod_version}"
displayName="${content_mod_name}"
authors="${mod_authors}"
modUrl="${mod_url}"
description='''${content_mod_description}'''

[[dependencies.${content_mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${content_mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${content_mod_id}]]
modId="${mod_id}"
type="required"
versionRange="[${mod_version},)"
ordering="AFTER"
side="BOTH"
