plugins {
    id 'java-library'
    id 'checkstyle'
    id 'pmd'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

def shadercNativesClassifier = {
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    if (os.contains('win')) {
        return 'natives-windows'
    }
    if (os.contains('mac')) {
        return arch.contains('aarch64') ? 'natives-macos-arm64' : 'natives-macos'
    }
    return arch.contains('aarch64') ? 'natives-linux-arm64' : 'natives-linux'
}

dependencies {
    // JSpecify supplies @NullMarked/@Nullable for the public api packages. It is
    // compile-only: annotations have CLASS retention and are not needed at runtime.
    compileOnly 'org.jspecify:jspecify:1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    // Headless GLSL validation in tests; shaderc compiles the shipped shader
    // sources without creating an OpenGL context or opening a window.
    testImplementation 'org.lwjgl:lwjgl-shaderc:3.3.3'
    testRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:${shadercNativesClassifier()}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    // Sodium is a required client dependency; keep the dev runs launchable. Sodium
    // declares @Mod(dist = CLIENT), so dedicated-server runs skip it.
    runtimeOnly 'maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The API boundary test reads the project paths through explicit properties
    // instead of relying on the test process working directory.
    systemProperty 'quasar.api.sourceRoot',
            layout.projectDirectory.dir('src/main/java').asFile.absolutePath
    systemProperty 'quasar.api.classesDir',
            layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
    // Shader discovery needs a real directory; the NeoForge test runtime presents
    // classpath resources through a union filesystem that cannot be walked.
    systemProperty 'quasar.shader.sourceRoot',
            layout.projectDirectory.dir('src/main/resources').asFile.absolutePath
}

// Quality gate. The tasks always produce reports; scripts/quality.sh compares
// them with config/quality/baseline.json and rejects regressions. Legacy debt is
// recorded in the baseline instead of blocking the build on day one.
checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/quality/checkstyle.xml')
    ignoreFailures = true
}

pmd {
    toolVersion = '7.8.0'
    ruleSets = []
    ruleSetFiles = files('config/quality/pmd.xml')
    ignoreFailures = true
}

tasks.withType(Checkstyle).configureEach {
    maxErrors = Integer.MAX_VALUE
    maxWarnings = Integer.MAX_VALUE
    reports {
        xml.required = true
        html.required = false
    }
}

tasks.withType(Pmd).configureEach {
    maxFailures = Integer.MAX_VALUE
    reports {
        xml.required = true
        html.required = false
    }
}

tasks.named('checkstyleMain', Checkstyle) {
    source = fileTree('src/main/java')
}
tasks.named('pmdMain', Pmd) {
    source = fileTree('src/main/java')
}
// The ratchet tracks production sources first. Test-source rules can be added
// once their baseline is reviewed separately.
tasks.named('checkstyleTest') {
    enabled = false
}
tasks.named('pmdTest') {
    enabled = false
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Expands mod metadata properties during resource processing.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            sodium_version_range   : sodium_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_url                : mod_url,
            mod_issue_tracker_url  : mod_issue_tracker_url,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
